name: SmartLot Automated Code Review & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  review_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check & Compiler Review
        run: npx tsc --noEmit

      - name: Audit CSS Tokens & Unthemed Styles
        run: |
          echo "Auditing modified files for unthemed hover/bg classes..."
          git diff HEAD~1 HEAD --name-only | grep -E '\.(tsx|ts)$' | while read file; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              grep -n "hover:bg-gray-50" "$file" | grep -v "dark:hover:bg" && echo "WARNING: Unthemed hover in $file" || true
            fi
          done

      - name: Run Production Build
        run: npm run build
