    <!-- Prevent Vite automated reload from resetting active user state -->
    <script>
      window.addEventListener('vite:beforeFullReload', function(e) {
        if (e && typeof e.preventDefault === 'function') {
          e.preventDefault();
        }
      });
      // Automatically unregister rogue PWA Service Workers from other localhost projects (e.g. Grandmaster Chess)
      if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var reg of registrations) {
            reg.unregister();
          }
        });
      }
    </script>
